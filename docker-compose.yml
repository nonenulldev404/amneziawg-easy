volumes:
  etc_wireguard:

services:
  amnezia-wg-easy:
    environment:
      # Изменение языка:
      # (Supports: en, ua, ru, tr, no, pl, fr, de, ca, es, ko, vi, nl, is, pt, chs, cht, it, th, hi)
      - LANG=ru
      # ⚠️ Обязательно:
      # Измените это значение на публичное имя хоста или IP-адрес Вашего VPN-сервера.
      - WG_HOST=raspberrypi.local
      - PASSWORD_HASH=$$2y$$10$$hBCoykrB95WSzuV4fafBzOHWKu9sbyVa34GJr8VV5R/pIelfEMYyG # (нужны двойные $$, хэш 'foobar123'; см. "How_to_generate_an_bcrypt_hash.md" для генерации хеша) - https://github.com/nonenulldev404/amneziawg-easy/blob/AmneziaWG/How_to_generate_an_bcrypt_hash.md
      # - WEBUI_HOST=0.0.0.0 # IP-адрес, к которому привязан веб-интерфейс.
      # - WG_DEVICE=eth0 # Ethernet-устройство, через которое должен пересылаться трафик AmneziaWG (Wireguard).
      # - PORT=51821 # Измените TCP-порт для веб-интерфейса, если хотите использовать другой.
      # - WG_PORT=51820 # Если вы меняете WG_PORT, не забудьте также изменить открытый порт PORT. Публичный UDP порт Вашего VPN-сервера. AmneziaWG (Wireguard) будет прослушивать его (в противном случае — порт по умолчанию) внутри контейнера Docker.
      # - WG_CONFIG_PORT=92820 # Порт UDP, используемый в Home Assistant Plugin - подробнее Порт UDP, используемый в Home Assistant Plugin - подробнее https://github.com/nonenulldev404/amneziawg-easy?tab=readme-ov-file#%D0%BF%D0%B0%D1%80%D0%B0%D0%BC%D0%B5%D1%82%D1%80%D1%8B
      # - WG_DEFAULT_ADDRESS=10.8.0.x # Диапазон IP-адресов клиентов (Вашей сети VPN). Измените, если хотите другую сеть.
      # - WG_DEFAULT_DNS=1.1.1.1 # DNS-сервер, который клиенты будут использовать. Если задано пустое значение, клиенты не будут использовать DNS.
      # - WG_MTU=1420 # MTU, который будут использовать клиенты. Сервер использует WG MTU по умолчанию.
      # - WG_ALLOWED_IPS=192.168.15.0/24, 10.0.1.0/24 # Разрешенные IP-адреса, которые будут использовать клиенты.
      # - WG_PERSISTENT_KEEPALIVE=25 # Значение в секундах для поддержания "соединения" открытым. Если это значение равно 0, то соединения не будут поддерживаться.
      # - WG_PRE_UP=echo "Pre Up" > /etc/wireguard/pre-up.txt # Перед поднятием интерфейса - Подготовка (например, настройка firewall). Смотрите config.js для значения по умолчанию. - подробнее https://github.com/nonenulldev404/amneziawg-easy/blob/AmneziaWG/src/config.js
      # - WG_POST_UP=echo "Post Up" > /etc/wireguard/post-up.txt # После поднятия интерфейса - Роутинг, NAT, правила iptables и т.п. Смотрите config.js для значения по умолчанию. - подробнее https://github.com/nonenulldev404/amneziawg-easy/blob/AmneziaWG/src/config.js
      # - WG_PRE_DOWN=echo "Pre Down" > /etc/wireguard/pre-down.txt # Перед остановкой интерфейса - Очистка или подготовка к отключению. Смотрите config.js для значения по умолчанию. - подробнее https://github.com/nonenulldev404/amneziawg-easy/blob/AmneziaWG/src/config.js
      # - WG_POST_DOWN=echo "Post Down" > /etc/wireguard/post-down.txt # После остановки интерфейса - Финальная очистка. Смотрите config.js для значения по умолчанию. - подробнее https://github.com/nonenulldev404/amneziawg-easy/blob/AmneziaWG/src/config.js
      # - UI_TRAFFIC_STATS=true # Включить подробную статистику RX/TX (приём/передача данных) клиента в веб-интерфейсе. RX (Receive) — сколько данных клиент получил (за всё время и за секнду), TX (Transmit) — сколько клиент данных отправил (за всё время и за секнду). Измеряется в байтах (Всего получено или отправлено байт B(bytes), KB, MB, GB, а так же получено или отправлено байт за секнду B(bytes)/s, KB/s, MB/s, GB/s).
      # - UI_CHART_TYPE=0 # (UI_CHART_TYPE=0 # Диаграммы отключены, UI_CHART_TYPE=1 # Линейная диаграмма, UI_CHART_TYPE=2 # Диаграмма с областями, UI_CHART_TYPE=3 # Столбчатая диаграмма.)
      # - AMNEZIA_JC=random # Один из параметров обфускации стандартной WireGuard конфигурации. По умолчанию выставляется рандомно для каждого клиента в диапазоне от 1 до 128 (условие обфускации Amnezia). Можно выставить значене вручную, но только в диапазоне от 1 до 128 (данное значение будет применяться к каждому клиенту).
      # - AMNEZIA_JMAX=random # Один из параметров обфускации стандартной WireGuard конфигурации. По умолчанию выставляется рандомно для каждого клиента в диапазоне от 1 до 1280 (условие обфускации Amnezia). Можно выставить значене вручную, но только в диапазоне от 1 до 1280 (данное значение будет применяться к каждому клиенту).
      # - AMNEZIA_JMIN=random # Один из параметров обфускации стандартной WireGuard конфигурации. По умолчанию выставляется рандомно для каждого клиента в диапазоне не превышающем AMNEZIA_JMAX (условие обфускации Amnezia). Можно выставить значене вручную, но только в диапазоне не превышающем AMNEZIA_JMAX (данное значение будет применяться к каждому клиенту).

    image: ghcr.io/nonenulldev404/amneziawg-easy:latest
    container_name: amneziawg-easy
    volumes:
      - etc_wireguard:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      # - NET_RAW # ⚠️ Раскомментируйте, если используете Podman
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
